# Bifrost MeshBBS Host Configuration

# Default logging level: "error", "warn", "info", "debug", "trace"
log_level = "debug"

[rate_limiter]
# Maximum packets per minute across all active BBS sessions
max_packets_per_minute = 45

# Maximum instantaneous burst size before hard throttling kicks in
max_burst_packets = 4

# Minimum quiet period between consecutive packet transmissions (milliseconds)
inter_packet_guard_ms = 350

# Maximum allowed transmitter duty cycle percentage (e.g., 1.0% for EU868)
max_duty_cycle_percent = 1.0

# Rolling window for airtime duty cycle calculation (seconds)
duty_cycle_window_secs = 3600

# Channel congestion backoff multiplier when collision/retry is detected
congestion_backoff_factor = 1.5

[asset_broadcaster]
# Enable passive public broadcasting of assets upon client request (multicast cache population)
enable_on_demand_broadcast = true

# Maximum duty cycle allocated to public asset broadcasts (%)
max_asset_broadcast_duty_cycle = 0.15

[form_colors]
# Default styling attributes for interactive forms (Standard ANSI 0-15 color codes)
submit_fg = 14      # Bright White
submit_bg = 4       # Blue
field_fg = 0      # Black
field_bg = 14     # Bright Blue

# List of node hex IDs (32 bytes = 64 hex characters) that should always have admin privileges
admin_nodes = [
    "0101010101010101010101010101010101010101010101010101010101010101"
]

[apps]
# The default entrypoint application (replaces hardcoded main menu)
main_app = "main_menu"
# List of enabled applications to load and register
enabled = [
    "main_menu",
    "messages",
    "profile",
    "minidungeon",
    "admin",
    "marketplace",
    "weather",
]

[packet_capture]
# Enable capturing all in/out raw and compressed packets with CSV metrics logging
enabled = false
directory = "captured_packets"

