[workspace]
resolver = "2"
members = [
    "crates/bifrost-compression",
    "crates/bifrost-ansi",
    "crates/bifrost-transport",
    "crates/bifrost-bbs",
    "crates/bifrost-client",
    "crates/bifrost-tuning",
    "crates/heimdall",
]

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
mlua = { version = "0.9", features = ["lua54", "vendored", "serialize"] }
log = "0.4"
env_logger = "0.10"
crossterm = "0.27"
