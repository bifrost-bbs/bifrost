[package]
name = "bifrost-app-runner"
version = "0.1.0"
edition = "2021"
description = "Standalone developer runtime and interactive testing CLI for Bifrost Lua BBS applications"

[[bin]]
name = "bifrost-runner"
path = "src/main.rs"

[dependencies]
bifrost-ansi = { path = "../bifrost-ansi" }
bifrost-compression = { path = "../bifrost-compression" }
bifrost-transport = { path = "../bifrost-transport" }
bifrost-bbs = { path = "../bifrost-bbs" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
mlua = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
crossterm = { workspace = true }
reqwest = { version = "0.11", features = ["blocking", "json"] }
