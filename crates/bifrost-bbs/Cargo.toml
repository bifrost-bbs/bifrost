[package]
name = "bifrost-bbs"
version = "0.1.0"
edition = "2021"
authors = ["Bifrost Contributors"]
description = "Bifrost BBS Host server daemon kernel, scheduler, and Lua sandbox interpreter"

[dependencies]
bifrost-ansi = { path = "../bifrost-ansi" }
bifrost-transport = { path = "../bifrost-transport" }
bifrost-compression = { path = "../bifrost-compression" }

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
thiserror.workspace = true
mlua.workspace = true
log.workspace = true
env_logger.workspace = true
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
